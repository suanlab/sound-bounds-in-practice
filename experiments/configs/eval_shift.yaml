# Evaluate a saved Safe-CEG checkpoint on a held-out synthetic workload.
# Consumed by: python -m src.training.evaluate --config <this file>
# NOTE: full distribution-shift scenarios are driven by
# experiments/scripts/run_distribution_shift.py; this config is the official
# single-checkpoint evaluation entrypoint. External learned baselines
# (GNCE/LMKG/FactorJoin) are NOT implemented and are intentionally not listed.
experiment:
  name: safe-ceg-eval
  seed: 42

checkpoint: results/checkpoints/safe_ceg.pt
tau: 2.0

eval_workload:
  families: [path, star, cycle]
  query_count: 40
  relation_counts: [3, 4, 5]
  seed: 142

output:
  results: results/eval/eval_results.json
