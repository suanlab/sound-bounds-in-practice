[project]
name = "safe-ceg"
version = "0.1.0"
description = "Learning-Augmented Cardinality Estimation Graphs with Safety Guarantees"
requires-python = ">=3.10"

[tool.ruff]
# vendored PostgreSQL source tree used to build the injection image
extend-exclude = ["experiments/pg_injection/build"]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
strict = true
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
